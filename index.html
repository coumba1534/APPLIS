<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Khatm</title>
    <meta name="description" content="Khatm al-Qur'an : lire le Coran en entier, à son rythme." />
    <meta name="theme-color" content="#1F5C52" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Khatm" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
      <style>
      /* Écran d'ouverture : affiché tout de suite, retiré par l'appli (au plus tard après 2 secondes). */
      #splash { position: fixed; inset: 0; z-index: 100; background: #F7F1E4; color: #154339; display: grid; place-items: center; text-align: center; transition: opacity .3s ease }
      #splash.out { opacity: 0; pointer-events: none }
      #splash .in { display: grid; gap: 14px; justify-items: center; padding: 0 24px }
      #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(21, 67, 57, .18) }
      #splash .ar { font-family: Amiri, "Noto Naskh Arabic", serif; font-size: 34px; line-height: 1.3; color: #B8741F }
      #splash .lat { font: 700 24px "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif }
      #splash .sub { font: 12px "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; opacity: .7 }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="in">
        <img src="icons/icon-192.png" alt="" />
        <div class="ar" dir="rtl">ختم القرآن</div>
        <div class="lat">Khatm al-Qur'an</div>
        <div class="sub">Lire le Coran en entier</div>
      </div>
    </div>
    <script>
      window.__splashAt = Date.now();
      window.hideSplash = function () {
        var el = document.getElementById('splash');
        if (!el || el.classList.contains('out')) return;
        el.classList.add('out');
        setTimeout(function () { el.remove(); }, 350);
      };
      setTimeout(window.hideSplash, 2000);
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
